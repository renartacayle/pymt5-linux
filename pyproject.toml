[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pymt5-linux"
version = "0.1.0"
description = "Production-grade MetaTrader 5 SDK & drop-in replacement for Linux with Wine IPC bridge, remote gateway, mock simulator, and async streaming."
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "renartacayle", email = "renartacayle@users.noreply.github.com" }
]
keywords = [
    "metatrader", "metatrader5", "mt5", "trading", "linux", "wine", 
    "algorithmic-trading", "forex", "crypto", "ai-trading", "quantitative-finance"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "typing-extensions>=4.0.0; python_version < '3.10'"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.20.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "black>=23.0.0"
]
gateway = [
    "psutil>=5.9.0"
]

[project.scripts]
pymt5-linux = "pymt5_linux.cli:main"
mt5linux = "pymt5_linux.cli:main"

[project.urls]
Homepage = "https://github.com/renartacayle/pymt5-linux"
Documentation = "https://github.com/renartacayle/pymt5-linux#readme"
Repository = "https://github.com/renartacayle/pymt5-linux"
Issues = "https://github.com/renartacayle/pymt5-linux/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pymt5_linux"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
